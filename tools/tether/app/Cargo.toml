[package]
name = "tether-app"
description = "tether menu-bar app: tray icon, popover and per-repo timers over tether-core; the same binary is the CLI"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tether"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tether-core = { path = "../core" }
find-clones = { path = "../../../crates/find-clones" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
