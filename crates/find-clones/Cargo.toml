[package]
name = "find-clones"
description = "Walks a few folders for git clones, and keeps what a scan found (ADR 0004). No UI deps, no git."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
